<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chat Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .search-container {
            max-width: 800px;
            margin: 20px auto;
        }
        #response {
            background-color: #f8f9fa;
            border-radius: 5px;
            padding: 15px;
            margin-top: 20px;
            white-space: pre-wrap;
        }
        .context-item {
            background-color: #e9ecef;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .result-title {
            font-weight: bold;
            color: #0d6efd;
        }
        .badge-source {
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">RAG Chat Interface</h1>

        <div class="search-container">
            <form id="searchForm">
                <div class="mb-3">
                    <label for="query" class="form-label">Введите вопрос:</label>
                    <input type="text" class="form-control" id="query" name="query" required
                           placeholder="Например: Что такое чистая архитектура?">
                </div>
                <button type="submit" class="btn btn-primary">Поиск</button>
            </form>

            <div id="response"></div>

            <div class="mt-4">
                <h3>Статус синхронизации</h3>
                <p><strong>Последняя синхронизация:</strong> <span id="lastSync">--</span></p>
                <p><strong>Количество векторов в базе:</strong> <span id="vectorCount">--</span></p>
            </div>

            <div class="mt-4">
                <h3>Найденный контекст</h3>
                <div id="contextContainer"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const query = document.getElementById('query').value;
            const responseDiv = document.getElementById('response');
            const contextContainer = document.getElementById('contextContainer');

            responseDiv.innerHTML = '<p class="text-muted">Идёт поиск... (векторизация, поиск в Qdrant, генерация)</p>';
            contextContainer.innerHTML = '';

            try {
                const res = await fetch('/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `query=${encodeURIComponent(query)}`
                });

                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }

                const data = await res.json();

                if (data.error) {
                    responseDiv.innerHTML = `<p class="text-danger">Ошибка: ${data.error}</p>`;
                    return;
                }

                // Ответ RAG
                responseDiv.innerHTML = `<h4>Ответ:</h4><p>${escapeHtml(data.response || 'Нет ответа')}</p>`;

                // Обновление статуса
                updateStatus(data);

                // Найденный контекст (топ-5)
                let contextHtml = '<div class="row">';
                (data.searchResult || []).forEach(result => {
                    const title = result.metadata.title || 'Без названия';
                    const source = result.metadata.source || 'Не указан';
                    const url = result.metadata.url || '';
                    const updated = result.metadata.updated_at || '';
                    const score = (result.score * 100).toFixed(1);

                    const sourceBadge = source === 'gitlab'
                        ? '<span class="badge bg-success">GitLab</span>'
                        : '<span class="badge bg-primary">EvaProject</span>';

                    contextHtml += `
                        <div class="col-md-12 mb-2">
                            <div class="context-item">
                                <p class="result-title">
                                    ${escapeHtml(title)} ${sourceBadge}
                                </p>
                                <p><strong>Источник:</strong> ${source}</p>
                                ${url ? `<p><strong>URL:</strong> <a href="${url}" target="_blank">${url}</a></p>` : ''}
                                ${updated ? `<p><strong>Дата обновления:</strong> ${escapeHtml(updated)}</p>` : ''}
                                <p>${escapeHtml(result.text.slice(0, 300))}...</p>
                                <p><small>Совпадение: ${score}%</small></p>
                            </div>
                        </div>
                    `;
                });
                contextHtml += '</div>';
                contextContainer.innerHTML = contextHtml;

            } catch (error) {
                responseDiv.innerHTML = `<p class="text-danger">Ошибка: ${error.message}</p>`;
                console.error('Search error:', error);
            }
        });

        // Обновление статуса синхронизации из ответа
        function updateStatus(data) {
            if (data.lastSync) {
                const d = new Date(data.lastSync);
                document.getElementById('lastSync').textContent = d.toLocaleString('ru-RU');
            } else {
                document.getElementById('lastSync').textContent = 'Никогда';
            }
            document.getElementById('vectorCount').textContent = data.vectorCount ?? '--';
        }

        // Экранирование HTML для безопасности
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
